[project]
name = "civicfix-ai-service"
version = "1.0.0"
description = "CivicFix AI microservice for complaint categorization, duplicate detection, and SLA urgency scoring"
authors = [{ name = "CivicFix Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
