# Test Profile with In-Memory H2
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:civicfix_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

civicfix:
  jwt:
    secret: civicfixSuperSecretKeyForDevelopmentMustBe32CharactersOrLonger
    expiration-ms: 3600000
    refresh-expiration-ms: 7200000
